# default.yml controls global settings and policies/queries that run on all hosts ("All teams").

policies:
queries:
agent_options:
controls:
org_settings:
  fleet_desktop:
    transparency_url: https://catoftheday.com
  server_settings:
    server_url: $FLEET_URL
  org_info:
    org_name: Detroit Motor City GitOps
  secrets:
    - secret: 4A23BDF4-AED2-4B24-8C21-B024C993E29A
  host_expiry_settings:
    host_expiry_enabled: true
    host_expiry_window: 30
  webhook_settings:
    - activities_webhook:
        enable_activities_webhook: true
        destination_url: https://webhook.site/detroit-motor-city-gitops